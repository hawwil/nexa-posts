<html dir="rtl" lang="ar"><head><link rel="stylesheet" href="base2.css"><link rel="stylesheet" href="phone.css"><style>

#e1{top:1080px;font-size:72px}
#e2{top:1220px;font-size:52px;color:#c084fc;direction:ltr}
</style></head><body>

<script>
const E=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const C=(t,a,b)=>Math.min(1,Math.max(0,(t-a)/(b-a)));
function win(t,a,b,fi=.45,fo=.4){const i=E(C(t,a,a+fi)),o=1-E(C(t,b-fo,b));return Math.min(i,o)}
function set(id,op,ty=0,sc=1){const e=document.getElementById(id);e.style.opacity=op;e.style.transform=`translateY(${ty}px) scale(${sc})`}
window.setT=function(t){
 document.getElementById('g1').style.opacity=.3+.15*Math.sin(t*1.3);
 let a=win(t,0.1,2.6); set('q1',a,(1-E(C(t,.1,.55)))*40,.92+.08*E(C(t,.1,.55)));
 a=win(t,2.6,5.2); set('q2',a,(1-E(C(t,2.6,3.05)))*40);
 const end=12.6;
 a=win(t,5.3,end,.5,.45); set('h1',a,(1-E(C(t,5.3,5.8)))*50);
 a=win(t,5.8,end,.5,.45); set('h2',a,(1-E(C(t,5.8,6.3)))*50,.9+.1*E(C(t,5.8,6.3)));
 a=win(t,6.4,end,.7,.45); set('ph',a,(1-E(C(t,6.4,7.2)))*260+Math.sin(t*1.6)*6);
 a=win(t,9.0,end,.45,.45); set('chips',a,0,.8+.2*E(C(t,9.0,9.45)));
 a=win(t,9.5,end,.45,.45); set('sub',a,(1-E(C(t,9.5,9.95)))*30);
 a=win(t,12.8,16,.6,.01); set('lg',a,0,.94+.06*E(C(t,12.8,13.6)));
 a=win(t,13.4,16,.45,.01); set('e1',a,(1-E(C(t,13.4,13.85)))*30);
 a=win(t,13.8,16,.45,.01); set('e2',a,(1-E(C(t,13.8,14.25)))*30);
};
setT(0);
</script></body></html>
